name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Inject API key placeholder if secret exists
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          node -e "const fs=require('fs');const path=require('path');const secret=process.env.API_KEY||'';if(!secret){console.log('API_KEY secret not set; skipping injection.');process.exit(0);}const root='dist';if(!fs.existsSync(root)){console.error('dist directory not found after build.');process.exit(1);}const files=[];const walk=(dir)=>{for(const entry of fs.readdirSync(dir,{withFileTypes:true})){const full=path.join(dir,entry.name);if(entry.isDirectory())walk(full);else if(/\.(js|html|txt)$/.test(entry.name))files.push(full);}};walk(root);let count=0;for(const file of files){const content=fs.readFileSync(file,'utf8');if(content.includes('__API_KEY_PLACEHOLDER__')){fs.writeFileSync(file,content.split('__API_KEY_PLACEHOLDER__').join(secret));count++;}}console.log('Injected API key into '+count+' file(s).');"

      - name: Include permanent carousel assets
        run: |
          test -f .well-known/carousel.json
          test -f preview-carousel.png
          touch dist/.nojekyll
          mkdir -p dist/.well-known
          cp .well-known/carousel.json dist/.well-known/carousel.json
          cp preview-carousel.png dist/preview-carousel.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
